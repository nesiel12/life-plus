<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Life Plus">
  <title>Life Plus</title>
  <!--
    PLACEHOLDER — solid gold only, deliberately not the multi-colour version.
    Drop the final artwork in at public/life-plus-mark.png and Logo.tsx picks
    it up automatically (it falls back to this file only if the PNG is absent).
  -->
  <defs>
    <linearGradient id="lp-gold" x1="14" y1="18" x2="114" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6D3A4"/>
      <stop offset="0.34" stop-color="#C8A462"/>
      <stop offset="0.62" stop-color="#B89355"/>
      <stop offset="1" stop-color="#876628"/>
    </linearGradient>
    <linearGradient id="lp-gold-soft" x1="24" y1="96" x2="108" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B89355"/>
      <stop offset="0.5" stop-color="#E6D3A4"/>
      <stop offset="1" stop-color="#A98246"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- interlaced ribbon loops, gold on gold -->
    <ellipse cx="62" cy="56" rx="39" ry="19.5" transform="rotate(-32 62 56)" stroke="url(#lp-gold)" stroke-width="8.5"/>
    <ellipse cx="66" cy="58" rx="39" ry="18.5" transform="rotate(28 66 58)" stroke="url(#lp-gold-soft)" stroke-width="8.5"/>
    <ellipse cx="64" cy="63" rx="33" ry="15.5" transform="rotate(-12 64 63)" stroke="url(#lp-gold)" stroke-width="7.5" opacity="0.75"/>
    <!-- brim + stem -->
    <path d="M40 92 C 45 75, 70 71, 92 79 C 107 84, 109 61, 96 51" stroke="url(#lp-gold-soft)" stroke-width="8"/>
    <path d="M58 85 C 56 98, 62 106, 70 110" stroke="url(#lp-gold)" stroke-width="7.5"/>
  </g>
</svg>
